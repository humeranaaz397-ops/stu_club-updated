<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teacher Live Class</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f9ff;
        }

        /* ================= NAVBAR ================= */

        .top-nav {
            background: #2c2a99;
            color: white;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        /* ================= MAIN ================= */

        .live-wrapper {
            padding: 25px;
        }

        .live-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        /* ================= VIDEO SECTION ================= */

        .video-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .video-box {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            overflow: hidden;
            background: black;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .live-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: red;
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
        }

        .recording-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ef4444;
            color: white;
            padding: 8px 14px;
            border-radius: 30px;
            font-size: 14px;
            display: none;
        }

        .live-info {
            margin-top: 20px;
        }

        .live-info h2 {
            color: #1d4ed8;
            margin-bottom: 10px;
        }

        .live-info p {
            color: #555;
        }

        /* ================= BUTTONS ================= */

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        .start-btn {
            background: #2563eb;
        }

        .record-btn {
            background: #16a34a;
        }

        .stop-btn {
            background: #f59e0b;
        }

        .end-btn {
            background: #ef4444;
        }

        /* ================= CHAT SECTION ================= */

        .chat-section {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            height: 650px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            background: #f9fafb;
        }

        .message {
            margin-bottom: 12px;
            background: #eef2ff;
            padding: 10px;
            border-radius: 10px;
        }

        .system-message {
            text-align: center;
            color: #666;
            margin: 10px 0;
            font-size: 13px;
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        .send-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* ================= FOOTER ================= */

        .footer {
            margin-top: 30px;
            background: #2c2a99;
            color: white;
            text-align: center;
            padding: 18px;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width:900px) {

            .live-container {
                grid-template-columns: 1fr;
            }

            .video-box {
                height: 300px;
            }

            .chat-section {
                height: 500px;
            }

        }
    </style>
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="top-nav">

        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>Student Club Teacher Panel</span>
        </div>

        <div>
            Welcome Dr. Humera Naaz
        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <div class="live-wrapper">

        <div class="live-container">

            <!-- ================= VIDEO SECTION ================= -->

            <div class="video-section">

                <div class="video-box">

                    <video id="teacherVideo" autoplay muted playsinline>
                    </video>

                    <div class="live-badge">
                        LIVE CLASS
                    </div>

                    <div class="recording-badge" id="recordingBadge">

                        🔴 Recording...

                    </div>

                </div>

                <div class="live-info">

                    <h2>Introduction to Machine Learning</h2>

                    <p>
                        Teacher: Dr. Humera Naaz
                    </p>

                    <div class="controls">

                        <button class="btn start-btn" onclick="startClass()">

                            <i class="fa-solid fa-video"></i>
                            Start Class

                        </button>

                        <button class="btn record-btn" onclick="startRecording()">

                            <i class="fa-solid fa-circle"></i>
                            Start Recording

                        </button>

                        <button class="btn stop-btn" onclick="stopRecording()">

                            <i class="fa-solid fa-stop"></i>
                            Stop Recording

                        </button>

                        <button class="btn end-btn" onclick="endClass()">

                            <i class="fa-solid fa-phone-slash"></i>
                            End Session

                        </button>

                    </div>

                </div>

            </div>

            <!-- ================= CHAT SECTION ================= -->

            <div class="chat-section">

                <div class="chat-header">

                    <h3>Students Chat & Questions</h3>

                    <div>
                        Students Online:
                        <span id="onlineCount">0</span>
                    </div>

                </div>

                <div class="chat-messages" id="messages">

                    <div class="system-message">
                        Students can ask doubts here
                    </div>

                </div>

                <div class="chat-input">

                    <input type="text" id="messageInput" placeholder="Reply to students...">

                    <button class="send-btn" onclick="sendMessage()">

                        Send

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        © 2026 Student Club All Rights Reserved

    </footer>

    <!-- ================= SCRIPT ================= -->

    <script>

        /* ======================
        SOCKET CONNECTION
        ====================== */

        const socket = io("http://localhost:5000");

        /* ======================
        VARIABLES
        ====================== */

        const room = "ml-class";

        const username = "Dr.HumeraNaaz";

        let mediaRecorder;

        let recordedChunks = [];

        let localStream;

        /* ======================
        START CLASS
        ====================== */

        async function startClass() {

            try {

                localStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });

                document
                    .getElementById("teacherVideo")
                    .srcObject = localStream;

                socket.emit("teacher_joined", {
                    room: room
                });

                addSystemMessage("Teacher started the class");

            }

            catch (error) {

                alert("Camera or microphone permission denied");

            }

        }

        /* ======================
        END CLASS
        ====================== */

        function endClass() {

            if (localStream) {

                localStream.getTracks().forEach(track => track.stop());

            }

            socket.emit("teacher_left", {
                room: room
            });

            addSystemMessage("Teacher ended the class");

            alert("Class ended successfully");

            window.location.href = "{{ url_for('teacher_live_classes') }}";

        }

        /* ======================
        START RECORDING
        ====================== */

        function startRecording() {

            if (!localStream) {

                alert("Please start the class first");

                return;
            }

            recordedChunks = [];

            mediaRecorder =
                new MediaRecorder(localStream);

            mediaRecorder.ondataavailable = event => {

                if (event.data.size > 0) {

                    recordedChunks.push(event.data);

                }

            };

            mediaRecorder.onstop = () => {

                const blob =
                    new Blob(recordedChunks, {
                        type: "video/webm"
                    });

                const url =
                    URL.createObjectURL(blob);

                const a =
                    document.createElement("a");

                a.href = url;

                a.download = "live-class-recording.webm";

                a.click();

            };

            mediaRecorder.start();

            document
                .getElementById("recordingBadge")
                .style.display = "block";

            addSystemMessage("Recording started");

        }

        /* ======================
        STOP RECORDING
        ====================== */

        function stopRecording() {

            if (mediaRecorder) {

                mediaRecorder.stop();

                document
                    .getElementById("recordingBadge")
                    .style.display = "none";

                addSystemMessage("Recording stopped");

            }

        }

        /* ======================
        SEND MESSAGE
        ====================== */

        function sendMessage() {

            const input =
                document.getElementById("messageInput");

            const message =
                input.value;

            if (message.trim() === "") {
                return;
            }

            socket.emit("send_message", {
                username: username,
                room: room,
                message: message
            });

            input.value = "";

        }

        /* ======================
        RECEIVE MESSAGE
        ====================== */

        socket.on("receive_message", data => {

            const messages =
                document.getElementById("messages");

            messages.innerHTML += `

        <div class="message">

            <b>${data.username}</b><br>

            ${data.message}

        </div>

    `;

            messages.scrollTop =
                messages.scrollHeight;

        });

        /* ======================
        ONLINE STUDENTS
        ====================== */

        socket.on("attendance_update", data => {

            document
                .getElementById("onlineCount")
                .innerText = data.users.length;

        });

        /* ======================
        SYSTEM MESSAGE
        ====================== */

        function addSystemMessage(text) {

            const messages =
                document.getElementById("messages");

            messages.innerHTML += `

        <div class="system-message">

            ${text}

        </div>

    `;

            messages.scrollTop =
                messages.scrollHeight;

        }

    </script>

</body>

</html>
